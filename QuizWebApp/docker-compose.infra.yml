services:
  db_local:
    image: postgres:16-alpine
    container_name: nesterov-quiz-pg-local
    restart: always
    environment:
      POSTGRES_DB: quiz_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - quiz_pgdata_local:/var/lib/postgresql/data

volumes:
  quiz_pgdata_local:
